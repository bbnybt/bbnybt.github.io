<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project — Single Showcase (Step Slider)</title>
    <link rel="stylesheet" href="phuclong.css" />
    <script defer src="phuclong.js"></script>
</head>
<body>
    <header id="site-header" class="header" role="banner">
        <div class="container header__inner">
            <a class="logo" href="index.html" aria-label="Trang chủ">
                <img src="phuclong.assets/logo type vertical.svg" alt="Logo" style="width:120px; padding-top:20px" />
            </a>
            <nav class="nav hide-on-mobile" aria-label="Chính">
                <a class="nav__link" href="project.html" data-cursor="">Project</a>
                <a class="nav__link" href="about.html" data-cursor="">About</a>
                <a class="nav__link" href="contact.html" data-cursor="">Contact</a>
            </nav>
            <button id="menu-toggle" class="hamburger" aria-label="Mở menu" aria-controls="offcanvas" aria-expanded="false" data-cursor="">
                <span class="hamburger__bar" aria-hidden="true"></span>
                <span class="hamburger__bar" aria-hidden="true"></span>
                <span class="hamburger__bar" aria-hidden="true"></span>
            </button>
        </div>
    </header>

    <div id="offcanvas" class="offcanvas" aria-hidden="true">
        <div class="offcanvas__backdrop" data-close></div>
        <aside class="offcanvas__panel" role="dialog" aria-modal="true" aria-label="Menu">
            <div class="offcanvas__header">
                <a class="logo" href="index.html" aria-label="Trang chủ">
                    <img src="phuclong.assets/mark.svg" alt="Logo" class="header_logo-img" />
                </a>
                <button class="offcanvas__close" data-close aria-label="Đóng menu">
                    <img src="phuclong.assets/close icon.svg" alt="" aria-hidden="true" width="30" height="30" decoding="async" draggable="false">
                </button>
            </div>

            <nav class="offcanvas__nav" aria-label="Menu phụ">
                <a class="menu-item" href="project.html">Project</a>
                <a class="menu-item" href="about.html">About</a>
                <a class="menu-item" href="contact.html">Contact</a>
            </nav>

            <div class="offcanvas__info">
                <div class="links">
                    <a class="text-link" href="mailto:nyenbaotran@gmail.com">→ nyenbaotran@gmail.com</a>
                    <a class="text-link" href="https://www.instagram.com/bb.nybt/" target="_blank" rel="noopener">→ Instagram</a>
                    <a class="text-link" href="https://www.linkedin.com/in/tranngyen/" target="_blank" rel="noopener">→ LinkedIn</a>
                </div>
            </div>
        </aside>
    </div>

    <main class="single">
        <div class="board-wrap container">
            <article class="board" aria-label="Project board">
                <h1 class="board-word">Phuc Long Rebrand</h1>
                <div class="board-slider" aria-hidden="true">
                    <div class="slider-viewport">
                        <div class="slider-track" id="sliderTrack" aria-live="off">
                            <figure class="slide"><img src="phuclong.assets/phuclong.1.jpg" alt="" draggable="false"></figure>
                            <figure class="slide"><img src="phuclong.assets/phuclong.2.jpg" alt="" draggable="false"></figure>
                            <figure class="slide"><img src="phuclong.assets/phuclong.3.jpg" alt="" draggable="false"></figure>
                            <figure class="slide"><img src="phuclong.assets/phuclong.4.jpg" alt="" draggable="false"></figure>
                            <figure class="slide"><img src="phuclong.assets/phuclong.5.jpg" alt="" draggable="false"></figure>
                            <figure class="slide"><img src="phuclong.assets/phuclong.6.jpg" alt="" draggable="false"></figure>
                            <figure class="slide"><img src="phuclong.assets/phuclong.7.jpg" alt="" draggable="false"></figure>
                            <figure class="slide"><img src="phuclong.assets/phuclong.8.jpg" alt="" draggable="false"></figure>
                            <figure class="slide"><img src="phuclong.assets/phuclong.9.jpg" alt="" draggable="false"></figure>
                            <figure class="slide"><img src="phuclong.assets/phuclong.10.jpg" alt="" draggable="false"></figure>
                            <figure class="slide is-clone" aria-hidden="true"><img src="single.assets/slide01.jpg" alt="" draggable="false"></figure>
                        </div>
                    </div>
                </div>
                <p class="board-caption">
                    Phuc Long is a coffee brand that takes pride in producing its coffee and tea. Tea leaves and coffee beans represent Phuc Long's expertise and commitment to the finest flavor.
                </p>
            </article>
        </div>
        <div class="cursor-wrapper">
            <div class="cursor" id="cursor">
                <div class="cursor-inner" id="cursor-inner">
                    <span id="cursor-label"></span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
